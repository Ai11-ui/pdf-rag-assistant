[project]
name = "pdf-rag-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for PDF RAG assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.10.0",
  "pypdf>=5.9.0",
  "sentence-transformers>=5.1.0",
  "faiss-cpu>=1.12.0",
  "numpy>=2.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "reportlab>=4.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
